name: Validate portable agent skills
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: node scripts/validate-skills.mjs
      - run: node --test scripts/validate-skills.test.mjs
  install-smoke:
    needs: structure
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [antigravity-cli, codex, cursor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - name: Test published installer using local source
        env:
          AGENT: ${{ matrix.agent }}
          DISABLE_TELEMETRY: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/install-smoke"
          cd "$RUNNER_TEMP/install-smoke"
          npx --yes skills@1.7.4 add "$GITHUB_WORKSPACE" --skill '*' --agent "$AGENT" --yes --copy
          node "$GITHUB_WORKSPACE/scripts/validate-skills.mjs" --installed .agents/skills
